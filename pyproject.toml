[build-system]
requires = [
    "setuptools>=61",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "redoubt"
version = "0.0.1"
description = "A peer-to-peer messaging app with end-to-end message encryption and hardened client runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"

dependencies = [
    "cryptography>=44.0.0",
    "sqlcipher3>=0.6.0",
    "textual>=0.60.0",
    "rich>=13.0.0"
]

[project.scripts]
redoubt = "redoubt.app:main"

[tool.setuptools]
packages = ["redoubt"]
